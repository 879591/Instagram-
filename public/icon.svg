<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="supriya-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="supriya-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#09090B" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#27272A" stroke-width="4" />
  
  <!-- Ambient background glow behind logo -->
  <circle cx="256" cy="256" r="140" fill="url(#supriya-grad)" opacity="0.18" filter="blur(30px)" />

  <!-- Original 'S' Brand Glyph for SUPRIYA -->
  <g filter="url(#shadow)">
    <!-- Upper loop of S -->
    <path d="M336 148 C336 148, 280 116, 216 116 C160 116, 128 152, 128 196 C128 244, 168 268, 228 288 L284 308 C336 326, 384 354, 384 412 C384 476, 320 500, 256 500 C184 500, 132 464, 132 464" 
          fill="none" 
          stroke="url(#supriya-grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Accent floating jewel ring representing 'Connect & Share' -->
    <circle cx="360" cy="148" r="22" fill="#FB7185" />
    <circle cx="152" cy="464" r="18" fill="#C084FC" />
  </g>
</svg>
